---
# Dynamic DNS (DuckDNS, free): a name that follows your home's public IP address. Used as the VPN endpoint.
# Steps (once, by hand): sign in at https://www.duckdns.org, create a name, copy the token, then
#   ansible-vault edit inventories/group_vars/all/vault.yml     and add   vault_duckdns_token: "<the token>"
# and write the name below. Then:  make ddns
# Leave the name empty to switch this off (the VPN then writes your current IP address into each client file instead).
ddns_duckdns_subdomain: "khefernetes"
