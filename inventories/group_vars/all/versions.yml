---
# Every pinned version in one place. Bump deliberately, one line at a time, and re-run the matching playbook.
ubuntu_release: noble
rke2_version: "v1.35.8+rke2r1"
jellyfin_version: "10.11.11" # image tags follow Jellyfin's release numbers

# local-path provisioner (node-local volumes). Re-check the checksum when bumping.
local_path_version: v0.0.37
local_path_sha256: 9781b39c24f3f651bd6d6e41b561e04e4904bbdb6d4f8c7a6009df3a702dcd65

# Tiny image for the storage self-test pods (make k8s-storage): a shell, stat, ln, flock and nothing else.
storage_test_image: docker.io/library/busybox:1.37.0

# MetalLB (gives LoadBalancer services a real LAN address). Re-check the checksum when bumping:
#   curl -sL https://raw.githubusercontent.com/metallb/metallb/<version>/config/manifests/metallb-native.yaml | sha256sum
metallb_version: v0.16.1
metallb_sha256: bf25feebb7582ca7df845efd52ffbc2960d6cbf4cfc972f47fded9f788b67f0b

# Intel GPU device plugin (hands /dev/dri to pods that ask for gpu.intel.com/i915).
# https://github.com/intel/intel-device-plugins-for-kubernetes/releases  The image tag follows the release number.
intel_gpu_plugin_version: "0.36.0"
