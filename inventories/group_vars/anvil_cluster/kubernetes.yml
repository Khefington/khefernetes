---
# Shared by every role that runs kubectl on a control plane.
kubectl_bin: /var/lib/rancher/rke2/bin/kubectl
kubeconfig_path: /etc/rancher/rke2/rke2.yaml
# Applications are applied from here with 'kubectl apply' (errors show up in the playbook).
k8s_app_manifest_dir: /etc/khefernetes/manifests
# Cluster add-ons dropped here are applied by RKE2 itself.
rke2_auto_manifest_dir: /var/lib/rancher/rke2/server/manifests
media_namespace: media
# Ingress controller: 'ingress-nginx' (RKE2 v1.35 default) or 'traefik'.
# Changing it only takes effect on a NEW cluster (it is written into RKE2's config at install time).
# See docs/networking.md before switching an existing cluster.
ingress_controller: traefik
ingress_class_name: "{{ 'traefik' if ingress_controller == 'traefik' else 'nginx' }}"
# ingress_vip (the one LAN address the ingress answers on) lives in group_vars/all/main.yml,
# because castellan's DNS server needs it too.
# The kubectl command line used by every role.
kubectl_cmd: "{{ kubectl_bin }} --kubeconfig {{ kubeconfig_path }}"
