---
# VM definitions
# "anvil" is just what I am calling the cluster itself. Nerd alert, naming convention stems from IG
# roles and ranks. From what I gather "hammer & anvil," is a common military strat. Two forces
# cooperate to achieve something. The anvil holds things down and is stationary while the hammer
# comes in to deal a blow. The basilisk and wyvern are artillary to hold units in place while the
# kasrkin are infantry to come in to strike. It's lame but I think it just gives everything a
# a little personality. Oh and a castellan is just an officer, thus the orchetrator of sub-units.

# group definition
# RKE2 Control Plane(s)
anvil_control_planes:
  hosts:
    kasrkin:
      # host variables | overwritten by a host_vars/kasrkin.yml, or higher
      ansible_host: 192.168.1.51
      vm_id: 201
# group definition
# RKE2 Worker Node(s)
anvil_workers:
  hosts:
    wyvern:
      # host variables | overwritten by a host_vars/wyvern.yml, or higher
      ansible_host: 192.168.1.52
      vm_id: 202
    basilisk:
      # host variables | overwritten by a host_vars/basilisk.yml, or higher
      ansible_host: 192.168.1.53
      vm_id: 203
# group definition
anvil_cluster:
  # example of sub-grouping
  children:
    anvil_control_planes:
    anvil_workers:
  # Inventory-file group vars | overwritten by any file in '/cluster/group_vars/',
  # '/cluster/group_vars/anvil_cluster', the subgroup itself, or higher
  vars:
    ansible_user: ansible
    vm_cores: 4
    vm_memory_mb: 8192
    vm_disk_gb: 100
    ansible_become: true

anvil_precedence:
  # example of sub-grouping
  children:
    anvil_control_planes:
      hosts:
        kasrkin:
          # Overwritten next by the actual inventory host_vars defined outside of this file
          cluster_precedence: "inventory file host_vars"
  vars:
    # Overwritten next by the actual inventory group_vars/all defined outside of this file
    cluster_precedence: "inventory file group_vars"
