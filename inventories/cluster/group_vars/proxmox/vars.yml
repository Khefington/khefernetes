---
# --- My Storage layout -------------------------------------------------------
# local / local-lvm : 1TB SSD (Proxmox OS, templates, other Partitions)
# vmdata            : 2TB SSD, Using as LVM-thin
# media             : 4TB HDD (already created by hand; NOT touched here)
proxmox_prepare_vm_disk: false
proxmox_vm_disk_device: /dev/nvme1n1
proxmox_vm_vg_name: vmdata
proxmox_vm_thinpool_name: data
proxmox_vm_storage_id: vmdata

# --- Repositories ---------------------------------------------------------
proxmox_remove_subscription_nag: false

# --- Automation identity --------------------------------------------------
proxmox_host_user: ansible@pam
proxmox_host_role: Automation
proxmox_host_token_id: Automation
proxmox_host_privs: >-
  Datastore.Allocate Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit
  Pool.Allocate Sys.Audit Sys.Console Sys.Modify SDN.Use
  VM.Allocate VM.Audit VM.Clone VM.Config.CDROM VM.Config.Cloudinit VM.Config.CPU
  VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options
  VM.Migrate VM.PowerMgmt

proxmox_api_user: ansible@pam
proxmox_api_token_id: Automation
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"

template_vmid: 9000
template_name: "khefernetes-ubuntu-{{ ubuntu_release }}-cloudinit"
template_storage: local-lvm
template_bridge: vmbr0
image_base_url: "https://cloud-images.ubuntu.com/{{ ubuntu_release }}/current"
image_orig: "{{ ubuntu_release }}-server-cloudimg-amd64.img"
image_custom: "khefernetes-{{ ubuntu_release }}-server-cloudimg-amd64-qga.img"
image_dir: /var/lib/vz/cloud-images

api_token_id: "{{ proxmox_api_token_id }}"
api_token_secret: "{{ proxmox_api_token_secret }}"
validate_certs: false
node: "{{ proxmox_node }}"
