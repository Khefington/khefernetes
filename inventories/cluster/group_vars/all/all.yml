---
# --NETWORK--
lan_subnet_cidr_prefix: 24
lan_gateway: 192.168.1.1
lan_dns_servers:
  - 192.168.1.1
  - 8.8.8.8 # Just use google dummy
lan_domain: home.lan

# --PROXMOX--
proxmox_node: castellan
proxmox_api_host: "192.168.1.50"
ansible_become_password: "{{ vault_ansible_become_password }}"

# Reserved for MetalLB later
metallb_range: 192.168.1.200-192.168.1.220

# Version-lock for RKE2
rke2_version: "v1.35.8+rke2r1"
# Version-lock for Ubuntu
ubuntu_release: noble

# Overwritten by playbook group_vars/all
cluster_precedence: "inventory group_vars/all"

ansible_ssh_key_dir: "~/.ssh/id_ed25519.pub"
media_uid: 1500 # the 'media' user/group that owns every library file
media_gid: 1500
