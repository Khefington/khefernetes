---
proxmox:
  hosts:
    castellan:
      ansible_host: 192.168.1.50
      ansible_user: ansible
      ansible_become: true # need to remove later but fine for now
# VM definitions
rke2_servers:
  hosts:
    rke2-server-01:
      ansible_host: 192.168.1.51
      vm_id: 201
      vm_cores: 4
      vm_memory_mb: 4096
      vm_disk_gb: 60
rke2_agents:
  hosts:
    rke2-agent-01:
      ansible_host: 192.168.1.52
      vm_id: 202
      vm_cores: 6
      vm_memory_mb: 10240
      vm_disk_gb: 250
    rke2-agent-02:
      ansible_host: 192.168.1.53
      vm_id: 203
      vm_cores: 6
      vm_memory_mb: 10240
      vm_disk_gb: 250
rke2_cluster:
  children:
    rke2_servers:
    rke2_agents:
  vars:
    ansible_user: ubuntu # default user for template in future
