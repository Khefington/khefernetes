---
# Structure and identity only: which hosts exist, which groups they belong to, and their address.
# Everything else lives in group_vars/ and host_vars/ (see docs/architecture.md).
#
# Naming: "anvil" is the cluster itself. Hammer and anvil: the anvil holds things in place while the
# hammer strikes. Basilisk and wyvern are the artillery that holds units, kasrkin are the infantry.
# A castellan is an officer: the orchestrator of sub-units, hence the Proxmox host.
all:
  children:
    proxmox:
      hosts:
        castellan:
          ansible_host: 192.168.1.50

    anvil_cluster:
      children:
        anvil_control_planes:
          hosts:
            kasrkin:
              ansible_host: 192.168.1.51
              vm_id: 201
        anvil_workers:
          hosts:
            wyvern:
              ansible_host: 192.168.1.52
              vm_id: 202
            basilisk:
              ansible_host: 192.168.1.53
              vm_id: 203
