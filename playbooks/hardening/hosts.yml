---
# Host hardening: automatic security updates on castellan, and a host firewall on castellan and the cluster VMs.
#   make host-firewall            plan only: shows the rules and has nft check them; changes nothing
#   make host-firewall-apply      applies them, castellan first, then the workers, then the control plane.
# Every machine is applied with an automatic rollback: if the controller cannot open a NEW connection after the rules load,
# the rules remove themselves after 3 minutes. Emergency off by hand: `systemctl stop khef-firewall` (console or SSH).
- name: Automatic security updates and firewall on castellan
  hosts: proxmox
  gather_facts: false
  roles:
    - role: host_updates
      when: host_firewall_apply | default(false) | bool
    - host_firewall

- name: Check the cluster VMs can still use castellan's NFS
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: NFS port on castellan reachable from the cluster
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['proxmox'][0]].ansible_host }}"
        port: 2049
        timeout: 15
      when: host_firewall_apply | default(false) | bool

- name: Firewall on the cluster VMs, one at a time, workers first
  hosts: anvil_workers:anvil_control_planes
  gather_facts: false
  serial: 1
  roles:
    - host_firewall
  post_tasks:
    - name: Check the cluster is still healthy (all nodes Ready)
      ansible.builtin.command: "{{ kubectl_cmd }} get nodes --no-headers"
      delegate_to: "{{ groups['anvil_control_planes'][0] }}"
      register: hardening_nodes
      changed_when: false
      until: hardening_nodes.rc == 0 and (hardening_nodes.stdout_lines | reject('search', ' Ready ') | list | length == 0)
      retries: 12
      delay: 10
      when: host_firewall_apply | default(false) | bool
