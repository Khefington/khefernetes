---
# Install RKE2 on the three VMs.
#   ansible-playbook playbooks/cluster/install_rke2.yml
# Needs vault_rke2_token in the vault and rke2_version in group_vars/all/all.yml.

- name: RKE2 control plane
  hosts: anvil_control_planes
  gather_facts: false
  serial: 1 # one server at a time (matters once you add more)
  roles:
    - rke2

- name: RKE2 workers
  hosts: anvil_workers
  gather_facts: false
  roles:
    - rke2

- name: Verify the cluster and fetch the kubeconfig
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: Wait until every node has joined and is Ready
      ansible.builtin.command: >-
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get nodes --no-headers
      register: nodes
      changed_when: false
      check_mode: false
      retries: 30
      delay: 10
      until:
        - nodes.rc == 0
        - nodes.stdout_lines | length == groups['anvil_cluster'] | length
        - nodes.stdout_lines | select('search', ' Ready ') | list | length == groups['anvil_cluster'] | length

    - name: Show the nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

    - name: Fetch the kubeconfig to this machine
      ansible.builtin.fetch:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/khefernetes.yaml"
        flat: true
      tags: kubeconfig

    - name: Point the kubeconfig at the control plane's LAN address
      ansible.builtin.replace:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/khefernetes.yaml"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ ansible_host }}:6443"
        mode: "0600"
      delegate_to: localhost
      become: false
      tags: kubeconfig
