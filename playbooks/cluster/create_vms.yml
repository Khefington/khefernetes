---
# Clone the cloud-init template into one VM per host in anvil_cluster.
#   ansible-playbook playbooks/cluster/create_vms.yml --check   (will skip API writes)
#   ansible-playbook playbooks/cluster/create_vms.yml
# Per-host values (vm_id, ansible_host, vm_cores, vm_memory_mb, vm_disk_gb) come from the inventory;
# override any of them in host_vars/<host>.yml.
# Needs a virtualenv Python with proxmoxer (make setup).

# ---- Play 1: talk to the Proxmox API (the VMs do not exist yet, so nothing connects to them) ----
- name: Create the cluster VMs from the template
  hosts: anvil_cluster
  gather_facts: false
  connection: local
  serial: 1 # one at a time: simpler, and gentle on the disk
  vars:
    ansible_become: false # play vars beat the group's ansible_become: true
    ansible_python_interpreter: "{{ ansible_playbook_python }}" # venv python (proxmoxer)
  module_defaults:
    community.proxmox.proxmox_kvm: &proxmox_api_with_node
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      node: "{{ proxmox_node }}"
    community.proxmox.proxmox_vm_info: *proxmox_api_with_node
    community.proxmox.proxmox_disk:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
  roles:
    - proxmox_vms

# ---- Play 1b: hardware that only the Proxmox host can attach (the GPU), then start those VMs ----
# Does nothing for VMs without `vm_gpu_passthrough: true`. A plain `make vms` refuses to stop a running VM for this;
# add ARGS="-e proxmox_vm_gpu_allow_restart=true" when a restart is fine. (Do not use --limit with a VM name here:
# this play runs on the Proxmox host.)
- name: Give the VMs their GPU and start them
  hosts: proxmox
  gather_facts: false
  roles:
    - proxmox_vm_gpu

# ---- Play 2: wait for the guests, over normal SSH ----
- name: Wait for the VMs to finish first boot
  hosts: anvil_cluster
  gather_facts: false
  tasks:
    - name: Wait for SSH, cloud-init and the hostname
      ansible.builtin.import_role:
        name: proxmox_vms
        tasks_from: wait.yml
