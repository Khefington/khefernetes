---
# Upgrade Jellyfin to the version in inventories/group_vars/all/versions.yml (10.11 -> 12). Read docs/runbooks/jellyfin-upgrade.md first.
#   make jellyfin-upgrade-check     (read-only; fix anything it calls a blocker)
#   make jellyfin-upgrade           (asks you to type UPGRADE)
# Steps: 1) check + confirm + pre-pull the image   2) backup through Jellyfin   3) uninstall plugins, copy the config volume,
#        start the new version (database migration)   4) re-apply the settings from Git (installs the plugins that exist for 12)
#        5) library scan + a second backup, made by the new version   6) GPU test.
# Steps 4-6 live in jellyfin_upgrade_finish.yml: if step 3 stops only because the migration is slow, run  make jellyfin-upgrade-finish.
- name: Step 1 - check, confirm, pull the new image
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: Check and ask
      ansible.builtin.import_role:
        name: jellyfin
        tasks_from: upgrade_prepare.yml

    - name: Make sure the backup job exists (make jellyfin-backup)
      ansible.builtin.command: "{{ kubectl_cmd }} -n {{ media_namespace }} get cronjob jellyfin-backup -o name"
      register: jellyfin_upgrade_cronjob
      changed_when: false
      failed_when: false

    - name: Stop with a helpful message if it does not
      ansible.builtin.assert:
        that: jellyfin_upgrade_cronjob.rc == 0
        fail_msg: "The backup job does not exist yet. Run `make jellyfin-backup` first; the upgrade takes a backup through it. Nothing was changed."
        quiet: true

    - name: Step 2 - take the backup (Jellyfin is still on the old version)
      ansible.builtin.include_role:
        name: jellyfin_backup
        tasks_from: run_now.yml

    - name: Step 3 - uninstall plugins, copy the volume, start the new version
      ansible.builtin.import_role:
        name: jellyfin
        tasks_from: upgrade_run.yml

- name: Steps 4 to 6 - settings, scan, second backup, GPU test (also available alone as make jellyfin-upgrade-finish)
  ansible.builtin.import_playbook: jellyfin_upgrade_finish.yml
