---
# The second half of `make jellyfin-upgrade`: wait until the new Jellyfin is Healthy, then settings from Git, scan, second backup, GPU test.
#   make jellyfin-upgrade-finish
# Use it when `make jellyfin-upgrade` stopped at "did not come up cleanly" but the log shows Jellyfin was only still migrating
# (it is safe to repeat; every step only changes what differs).
- name: Wait until the new Jellyfin has finished starting
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: Wait (up to jellyfin_upgrade_startup_minutes)
      ansible.builtin.import_role:
        name: jellyfin
        tasks_from: upgrade_wait.yml

# The backup CronJob runs the same image tag as Jellyfin: apply it so the nightly job uses the new one too.
- name: Step 4a - move the nightly backup job to the new image
  hosts: anvil_control_planes[0]
  gather_facts: false
  roles:
    - jellyfin_backup

# The migration may have reset settings that changed meaning in 12; this puts back everything the repo describes
# and installs the plugins that have a 12 build (Open Subtitles).
- name: Step 4b - re-apply the settings from Git
  hosts: anvil_control_planes[0]
  gather_facts: false
  roles:
    - jellyfin_provision

- name: Step 5 - library scan and a second backup (made by the new version)
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: Start a library scan
      ansible.builtin.import_role:
        name: jellyfin
        tasks_from: upgrade_finish.yml

    - name: Back up now
      ansible.builtin.include_role:
        name: jellyfin_backup
        tasks_from: run_now.yml

    - name: What is left to do
      ansible.builtin.debug:
        msg:
          - "Jellyfin {{ jellyfin_version }} is running. Sign in and look around (docs/runbooks/jellyfin-upgrade.md, 'After the upgrade')."
          - "The config volume copy {{ jellyfin_upgrade_snapshot_path | default('(none was made)') }} stays on the node until you delete it."
          - "Once you are happy with it: make jellyfin-upgrade-cleanup"

# Last on purpose: if FFmpeg 8 cannot use the GPU this fails loudly, but everything above has already happened.
- name: Step 6 - does Quick Sync still work (FFmpeg 8)?
  hosts: anvil_control_planes[0]
  gather_facts: false
  tasks:
    - name: Run the GPU checks
      ansible.builtin.import_role:
        name: jellyfin
        tasks_from: gpu_test.yml
