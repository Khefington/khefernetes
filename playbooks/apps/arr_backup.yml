---
# Nightly backup of Sonarr, Radarr and Prowlarr: asks each app for its own backup zip and keeps the newest N on the HDD
# (<hdd>/data/backups/arr). Needs `make arr`.
#   make arr-backup                                  install the job
#   make arr-backup ARGS="-e arr_backup_run_now=true"   install it and run one now (as a test)
- name: Resolve the storage paths
  ansible.builtin.import_playbook: ../common/storage_paths.yml

- name: Make sure the backup folder exists on the HDD
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Create the folder tree
      ansible.builtin.import_role:
        name: nfs_server
        tasks_from: tree.yml

- name: Install the backup job
  hosts: anvil_control_planes[0]
  gather_facts: false
  roles:
    - arr_backup
