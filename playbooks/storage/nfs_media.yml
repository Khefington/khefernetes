---
# Share storage from castellan to the cluster VMs over NFS, then prove each VM can use it.
#   ansible-playbook playbooks/proxmox/prepare_staging_disk.yml -e staging_disk_prepare=true   (once)
#   ansible-playbook playbooks/storage/nfs_media.yml
#
# Two exports:
#   <hdd>/data          media/ + downloads/  (ONE export so hardlinks work for seeding)
#   /mnt/staging/incomplete                  (2TB SSD: in-progress downloads)
# Settings live in inventories/cluster/group_vars/proxmox/vars.yml.

# ---- Play 1: the NFS server, on the Proxmox host ----------------------------------
- name: NFS server on the Proxmox host
  hosts: proxmox
  vars:
    nfs_client_ips: "{{ groups['anvil_cluster'] | map('extract', hostvars, 'ansible_host') | list }}"
    nfs_export_options: "rw,sync,no_subtree_check,all_squash,anonuid={{ media_uid }},anongid={{ media_gid }}"
  tasks:
    - name: Ask Proxmox where the storage '{{ media_hdd_storage_id }}' lives
      ansible.builtin.command: pvesh get /storage/{{ media_hdd_storage_id }} --output-format json
      register: storage_cfg
      changed_when: false
      check_mode: false

    - name: Work out the paths
      ansible.builtin.set_fact:
        media_hdd_path: "{{ (storage_cfg.stdout | from_json).path }}"
        data_export_path: "{{ (storage_cfg.stdout | from_json).path }}/{{ data_export_subdir }}"
        staging_export_path: "{{ staging_mount_path }}/incomplete"

    # If a disk were not mounted, mkdir below would silently fill the 1TB SSD instead.
    - name: Make sure the HDD and the staging SSD are really mounted
      ansible.builtin.command: mountpoint -q {{ item }}
      changed_when: false
      check_mode: false
      loop:
        - "{{ media_hdd_path }}"
        - "{{ staging_mount_path }}"

    - name: Install the NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the 'media' group
      ansible.builtin.group:
        name: media
        gid: "{{ media_gid }}"
        system: true

    - name: Create the 'media' user (owns every file in the library; cannot log in)
      ansible.builtin.user:
        name: media
        uid: "{{ media_uid }}"
        group: media
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create the folder tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: media
        group: media
        mode: "2775" # setgid: new files inherit the 'media' group
      loop:
        - "{{ data_export_path }}"
        - "{{ data_export_path }}/media"
        - "{{ data_export_path }}/media/movies"
        - "{{ data_export_path }}/media/tv"
        - "{{ data_export_path }}/media/music"
        - "{{ data_export_path }}/downloads"
        - "{{ staging_export_path }}"

    - name: Make sure /etc/exports.d exists
      ansible.builtin.file:
        path: /etc/exports.d
        state: directory
        mode: "0755"

    - name: Export both trees to the cluster VMs only
      ansible.builtin.copy:
        dest: /etc/exports.d/khefernetes.exports
        mode: "0644"
        content: |
          # Managed by Ansible (khefernetes). Only the cluster VMs may mount these.
          {% for path in [data_export_path, staging_export_path] %}
          {{ path }} {% for ip in nfs_client_ips %}{{ ip }}({{ nfs_export_options }}){{ ' ' if not loop.last }}{% endfor %}

          {% endfor %}
      notify: Re-export NFS shares

    - name: Enable and start the NFS server
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started

    - name: Remember the exports for the client play
      ansible.builtin.set_fact:
        nfs_export_list:
          - { path: "{{ data_export_path }}", hardlink_test: true }
          - { path: "{{ staging_export_path }}", hardlink_test: false }

  handlers:
    - name: Re-export NFS shares
      ansible.builtin.command: exportfs -ra

# ---- Play 2: the NFS clients, on the VMs, and real mount tests --------------------
- name: NFS clients on the cluster VMs
  hosts: anvil_cluster
  gather_facts: false
  tasks:
    - name: Install the NFS client tools
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Mount, write, check ownership, hardlink (then clean up)
      ansible.builtin.include_tasks: tasks/nfs_mount_test.yml
      loop: "{{ hostvars['castellan'].nfs_export_list }}"
      loop_control:
        loop_var: export
        index_var: export_idx
