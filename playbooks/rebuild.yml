---
# Stand everything up after `make destroy-vms` (or on a first build): the whole of docs/rebuild.md steps 3 to 6 in one go.
#   make rebuild
#   make rebuild ARGS="-e rebuild_restore=false"     first build / no backup to restore: skip the Jellyfin restore
# Order: build (site.yml) > restore Jellyfin from its newest backup (asks you to type RESTORE) > host firewall + updates >
#        cluster hardening > VPN and dynamic DNS on castellan > first backups > read-only security audit.
# Everything is idempotent: if it stops half way, fix the cause and run `make rebuild` again.
#
# Switches (all default to true; -e name=false turns one off):
#   rebuild_restore   restore Jellyfin's data from the newest backup. Do this BEFORE the 05:30 backup job has run on the new cluster,
#                     otherwise the newest zip is a backup of the empty server (the restore lists every zip with its date).
#   rebuild_harden    host firewall (castellan + VMs), cluster pod-security + network policies
#   rebuild_vpn       WireGuard (and DuckDNS when ddns_duckdns_subdomain is set) on castellan
#   rebuild_backups   take one Jellyfin backup and one etcd snapshot at the end
#   rebuild_audit     print the read-only security audit at the end
#
# Not included (one-off or destructive, by hand): destroying the VMs (make destroy-vms), first-time Proxmox setup
# (proxmox/bootstrap.yml, harden.yml, gpu_host.yml), formatting the staging disk, the router steps (DNS server, UDP 51820 forward).
- name: Pre-flight, before anything is built
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_become_password: "" # not needed here; without this a missing vault would stop with a less helpful message
  tasks:
    - name: Every vault secret this build needs is present (and not the example placeholder)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='changeme') | string != 'changeme'
          - lookup('ansible.builtin.vars', item, default='') | string | length > 0
        quiet: true
        fail_msg: "{{ item }} is missing or still 'changeme' in inventories/group_vars/all/vault.yml (ansible-vault edit it; names: docs/examples/vault.example.yml)."
      loop:
        - vault_ansible_become_password
        - vault_proxmox_api_token_secret
        - vault_rke2_token
        - vault_jellyfin_khef_password
        - vault_opensubtitles_username
        - vault_opensubtitles_password

- name: Pre-flight, castellan answers
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Reach castellan
      ansible.builtin.ping:

# 1. Build ----------------------------------------------------------------------------------------------------------------
- name: Build (template, VMs, GPU, NFS, RKE2, networking, DNS, storage, Jellyfin, backup job)
  ansible.builtin.import_playbook: site.yml

# 2. Restore ---------------------------------------------------------------------------------------------------------------
- name: Restore Jellyfin's data from the newest backup, then re-apply the settings and profile pictures
  ansible.builtin.import_playbook: apps/jellyfin_restore.yml
  when: rebuild_restore | default(true) | bool

# 3. Hardening -------------------------------------------------------------------------------------------------------------
- name: Host firewall and automatic security updates (castellan, then the VMs, with automatic rollback)
  ansible.builtin.import_playbook: hardening/hosts.yml
  vars:
    host_firewall_apply: true
  when: rebuild_harden | default(true) | bool

- name: Cluster pod-security labels and network policies (with live proofs and automatic rollback)
  ansible.builtin.import_playbook: hardening/cluster.yml
  vars:
    k8s_hardening_apply: true
  when: rebuild_harden | default(true) | bool

# 4. castellan services that live outside the cluster ---------------------------------------------------------------------
- name: VPN (WireGuard on castellan; keys are kept if they exist)
  ansible.builtin.import_playbook: hardening/wireguard.yml
  when: (rebuild_vpn | default(true) | bool) and (wireguard_enabled | default(false) | bool)

- name: Dynamic DNS for the VPN endpoint
  ansible.builtin.import_playbook: hardening/ddns.yml
  when: (rebuild_vpn | default(true) | bool) and ((ddns_duckdns_subdomain | default('')) | length > 0)

# 5. First backups of the new cluster (after the restore, so they hold the restored data) ------------------------------------
- name: First Jellyfin backup
  ansible.builtin.import_playbook: apps/jellyfin_backup.yml
  vars:
    jellyfin_backup_run_now: true
  when: rebuild_backups | default(true) | bool

- name: First etcd snapshot (the new cluster has a new token)
  ansible.builtin.import_playbook: cluster/etcd_backup.yml
  vars:
    etcd_backup_take_snapshot_now: true
  when: rebuild_backups | default(true) | bool

# 6. Look at the result ---------------------------------------------------------------------------------------------------
- name: Security audit (read-only)
  ansible.builtin.import_playbook: operations/security_audit.yml
  when: rebuild_audit | default(true) | bool

- name: What is left to check by hand
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Checklist
      ansible.builtin.debug:
        msg:
          - "The rebuild finished. Check by hand (docs/rebuild.md section 5):"
          - "1. http://jellyfin.{{ lan_domain }}: sign in as Khef; your home screen, watched marks and profile picture are back (make jellyfin-profile-check)."
          - "2. A video plays and scrubbing shows thumbnails. make diagnose-jellyfin should show all PASS."
          - "3. From outside the house, with Wi-Fi off: switch the WireGuard tunnel on and open http://jellyfin.{{ lan_domain }}."
          - "4. Compare the audit above with your last one: no new [WARN]."
