---
# Turn the empty 2TB SSD into an ext4 filesystem mounted at /mnt/staging on castellan.
#
#   1) Look first (changes nothing, shows the disk it found):
#        ansible-playbook playbooks/proxmox/prepare_staging_disk.yml
#   2) Format + mount (DESTROYS everything on staging_disk_device):
#        ansible-playbook playbooks/proxmox/prepare_staging_disk.yml -e staging_disk_prepare=true
#
# Safe to re-run: once the disk is ours (mounted at staging_mount_path) it is left alone.
# A disk that already has partitions or a filesystem is never touched; the play stops.
- name: Prepare the 2TB SSD as staging storage
  hosts: proxmox
  vars:
    staging_partition: "{{ staging_disk_device }}{{ 'p1' if staging_disk_device[-1] is match('[0-9]') else '1' }}"
  tasks:
    - name: Inspect the disk
      ansible.builtin.command: lsblk --json --bytes --output NAME,TYPE,SIZE,FSTYPE,MODEL,SERIAL {{ staging_disk_device }}
      register: lsblk_out
      changed_when: false
      check_mode: false

    - name: Read the details
      ansible.builtin.set_fact:
        disk: "{{ (lsblk_out.stdout | from_json).blockdevices[0] }}"

    - name: Is it already prepared (our partition mounted at the staging path)?
      ansible.builtin.command: findmnt --noheadings --output SOURCE {{ staging_mount_path }}
      register: current_mount
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Work out the state
      ansible.builtin.set_fact:
        staging_ready: "{{ current_mount.stdout | trim == staging_partition }}"
        disk_is_blank: "{{ disk.children is not defined and disk.fstype is none }}"

    - name: Show what was found
      ansible.builtin.debug:
        msg:
          - "Device: {{ staging_disk_device }}  Model: {{ disk.model }}  Serial: {{ disk.serial }}"
          - "Size: {{ (disk.size | int / 1000000000000) | round(2) }} TB"
          - "State: {{ 'already prepared and mounted' if staging_ready else ('blank, ready to format' if disk_is_blank else 'NOT BLANK') }}"

    - name: Check it is a 2TB-class disk (guards against the wrong device)
      ansible.builtin.assert:
        that:
          - disk.type == 'disk'
          - disk.size | int > 1500000000000
          - disk.size | int < 2500000000000
        fail_msg: "{{ staging_disk_device }} does not look like the 2TB SSD. Run 'lsblk -f' on castellan and fix staging_disk_device."

    - name: Refuse to touch a disk that already has data
      ansible.builtin.fail:
        msg: >-
          {{ staging_disk_device }} already has partitions or a filesystem and is not our staging disk.
          Inspect it with 'lsblk -f'. If you are certain it is disposable, wipe it by hand
          (wipefs --all {{ staging_disk_device }}) and run this again.
      when: not staging_ready and not disk_is_blank

    - name: Stop here unless formatting was explicitly requested
      ansible.builtin.meta: end_host
      when: not staging_ready and not (staging_disk_prepare | bool)

    - name: Make sure parted is installed
      ansible.builtin.apt:
        name: parted
        state: present

    # ---- Everything below only runs on a blank disk with the switch on, or on re-runs ----
    - name: Create a GPT partition table with one partition
      community.general.parted:
        device: "{{ staging_disk_device }}"
        label: gpt
        number: 1
        part_start: 1MiB
        part_end: 100%
        state: present
      when: not staging_ready

    - name: Create the ext4 filesystem
      community.general.filesystem:
        fstype: ext4
        dev: "{{ staging_partition }}"
        opts: "-L {{ staging_label }} -m 1" # 1% reserved for root instead of the default 5%
      when: not staging_ready

    - name: Mount it now and on every boot ('nofail' so a missing disk cannot block Proxmox booting)
      ansible.posix.mount:
        path: "{{ staging_mount_path }}"
        src: "LABEL={{ staging_label }}"
        fstype: ext4
        opts: defaults,noatime,nofail
        state: mounted
