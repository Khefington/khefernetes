---
# Build the Ubuntu cloud-init VM template (ID 9000) on castellan.
#   ansible-playbook playbooks/proxmox/vm_template.yml
# Rule of thumb used here: files on the host go over SSH, Proxmox objects go through the API.
#
# Needs in group_vars/proxmox/vars.yml:
#   proxmox_api_user: ansible@pve          # exactly as shown under Datacenter > Permissions > API Tokens
#   proxmox_api_token_id: automation       # the part after the "!"
#   proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"   # and the secret itself in the vault
- name: Build the Ubuntu cloud-init template
  hosts: castellan
  # Shared connection settings for every API task below.

  tasks:
    # ---- Part 1: prepare the image file on the host (SSH) -------------------------
    - name: Install libguestfs-tools (edits disk images without booting them)
      ansible.builtin.apt:
        name: libguestfs-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the image directory
      ansible.builtin.file:
        path: "{{ image_dir }}"
        state: directory
        mode: "0755"

    - name: Download the Ubuntu cloud image and verify its checksum
      ansible.builtin.get_url:
        url: "{{ image_base_url }}/{{ image_orig }}"
        dest: "{{ image_dir }}/{{ image_orig }}"
        checksum: "sha256:{{ image_base_url }}/SHA256SUMS"
        mode: "0644"

    - name: Build the customized image (adds the QEMU guest agent)
      ansible.builtin.shell: |
        set -e
        cp {{ image_dir }}/{{ image_orig }} {{ image_dir }}/{{ image_custom }}.tmp
        virt-customize -a {{ image_dir }}/{{ image_custom }}.tmp --install qemu-guest-agent
        mv {{ image_dir }}/{{ image_custom }}.tmp {{ image_dir }}/{{ image_custom }}
      args:
        creates: "{{ image_dir }}/{{ image_custom }}"
      environment:
        LIBGUESTFS_BACKEND: direct

    # ---- Part 2: create the VM through the API ------------------------------------
    - name: Create the empty VM (API)
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false # Proxmox ships a self-signed certificate
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vmid }}"
        name: "{{ template_name }}"
        state: present
        ostype: l26
        cpu: host
        cores: 2
        memory: 2048
        scsihw: virtio-scsi-single
        net:
          net0: "virtio,bridge={{ template_bridge }}"
        ide:
          ide2: "{{ template_storage }}:cloudinit"
        serial:
          serial0: socket
        vga: serial0
        agent: "enabled=1"
        tags: [template, ubuntu]
        timeout: 120
      delegate_to: localhost
      become: false

    # ---- Part 3: attach the image as the VM's disk (SSH) --------------------------
    # Why SSH: the API only lets root@pam import from a file path, and your token is not root.
    - name: Read the VM's current configuration
      ansible.builtin.command: "qm config {{ template_vmid }}"
      register: vm_config
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Import the image as the VM's boot disk
      ansible.builtin.command: >-
        qm set {{ template_vmid }}
        --scsi0 {{ template_storage }}:0,import-from={{ image_dir }}/{{ image_custom }}
        --boot order=scsi0
      when: "'scsi0:' not in (vm_config.stdout | default(''))"
      changed_when: true

    # ---- Part 4: freeze it as a template (API) ------------------------------------
    - name: Convert the VM to a template (API)
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: false # Proxmox ships a self-signed certificate
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vmid }}"
        state: template
      delegate_to: localhost
      become: false

      # ansible-playbook playbooks/proxmox/vm_template.yml --check --diff   # some tasks will skip; that's expected
      # ansible-playbook playbooks/proxmox/vm_template.yml                  # a few minutes: ~600MB download plus image edit
      # ansible castellan -m command -a "qm config 9000"                    # expect template: 1, a scsi0 disk, an ide2 cloud-init drive
      # ansible-playbook playbooks/proxmox/vm_template.yml
