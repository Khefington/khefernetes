[defaults]
# default is rke2 cluster but should be overwritten as needed for different hosts and such 
inventory = inventories/cluster/
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
vault_password_file = .vault_pass
collections_path = /home/kfilip/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
