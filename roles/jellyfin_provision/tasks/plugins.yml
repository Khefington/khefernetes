---
# 1) Make sure our plugin repositories are registered (the official one stays).
- name: Read the registered plugin repositories
  ansible.builtin.uri:
    url: "{{ jellyfin_provision_url }}/Repositories"
  register: jellyfin_provision_repos
  changed_when: false

- name: Work out which of ours are missing
  ansible.builtin.set_fact:
    jellyfin_provision_repos_missing: >-
      {{ jellyfin_plugin_repositories
         | rejectattr('Url', 'in', jellyfin_provision_repos.json | map(attribute='Url') | list)
         | list }}

- name: Register the missing repositories
  ansible.builtin.uri:
    url: "{{ jellyfin_provision_url }}/Repositories"
    method: POST
    body_format: json
    body: "{{ jellyfin_provision_repos.json + jellyfin_provision_repos_missing }}"
    status_code: 204
  when: jellyfin_provision_repos_missing | length > 0

  # 2) Install the plugins that are not there yet.
  changed_when: true
- name: Read the installed plugins
  ansible.builtin.uri:
    url: "{{ jellyfin_provision_url }}/Plugins"
  register: jellyfin_provision_plugins
  changed_when: false

- name: Install what is missing
  ansible.builtin.include_tasks: plugin_one.yml
  loop: "{{ jellyfin_plugins }}"
  loop_control:
    loop_var: plugin
    label: "{{ plugin.name }}"

# 3) New plugins only load after a restart.
- name: Restart Jellyfin so the new plugins load
  when: jellyfin_provision_installed_now | default([]) | length > 0
  block:
    - name: Ask Jellyfin to restart
      ansible.builtin.uri:
        url: "{{ jellyfin_provision_url }}/System/Restart"
        method: POST
        status_code: 204
      changed_when: true

    - name: Give it time to go down
      ansible.builtin.pause:
        seconds: "{{ jellyfin_provision_restart_pause }}"

    - name: Wait for it to come back
      ansible.builtin.include_tasks: wait.yml

- name: Read the plugins again (this is the list to pin)
  ansible.builtin.uri:
    url: "{{ jellyfin_provision_url }}/Plugins"
  register: jellyfin_provision_plugins_now
  changed_when: false

- name: Remember the plugin list for the summary
  ansible.builtin.set_fact:
    jellyfin_provision_plugins_final: >-
      {{ jellyfin_provision_plugins_now.json
         | map(attribute='Name') | zip(jellyfin_provision_plugins_now.json | map(attribute='Version'))
         | map('join', ' ') | list }}
