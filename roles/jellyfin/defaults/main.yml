---
jellyfin_hostname: "jellyfin.{{ lan_domain }}"
jellyfin_ingress_class: "{{ ingress_class_name }}"
jellyfin_config_size: 20Gi # users, watch history, metadata, trickplay images
jellyfin_cache_limit: 20Gi # transcoding scratch space (/cache) on the node's disk
jellyfin_tmp_limit: 4Gi # /tmp: ffmpeg frames and trickplay tiles are built here before being moved to /config
jellyfin_cpu_request: 2000m # reserved on the node; Jellyfin may burst above it (no CPU limit)
jellyfin_memory_request: 2Gi
jellyfin_memory_limit: 10Gi # wyvern has 16 GiB; leave room for the OS, RKE2 and other pods
jellyfin_rollout_timeout: 600s
jellyfin_startup_timeout_seconds: 300 # how long Kubernetes waits for Jellyfin's first answer after a (re)start before it kills the pod
jellyfin_manifest_path: "{{ k8s_app_manifest_dir }}/jellyfin.yaml"
# Quick Sync: on automatically when a VM in the inventory has vm_gpu_passthrough: true. The pod then asks for the GPU
# (gpu.intel.com/i915) and joins the render group. Force it off with -e jellyfin_gpu_enabled=false.
jellyfin_gpu_enabled: >-
  {{ (groups['anvil_cluster'] | map('extract', hostvars) | selectattr('vm_gpu_passthrough', 'defined')
      | selectattr('vm_gpu_passthrough') | list | length) > 0 }}
jellyfin_gpu_ffmpeg: /usr/lib/jellyfin-ffmpeg/ffmpeg
jellyfin_gpu_test_file: /tmp/khef-gpu-test.mp4
jellyfin_log_dir: /config/log
jellyfin_transcode_check_count: 3

# make jellyfin-restore (see roles/jellyfin/tasks/restore.yml)
jellyfin_restore_archive: "" # empty = the newest backup Jellyfin can see; or a file name such as jellyfin-backup-20261012125828.zip
jellyfin_restore_confirm: "" # -e jellyfin_restore_confirm=RESTORE skips the question (for scripts)
jellyfin_restore_provision: true # run `make jellyfin-provision` afterwards (re-applies the settings from Git, refreshes the backup key)
jellyfin_restore_allow_newer: false # -e jellyfin_restore_allow_newer=true: restore a zip made by a NEWER Jellyfin (not recommended)
jellyfin_restore_pause: 20 # seconds to let Jellyfin shut down before waiting for it to come back
jellyfin_restore_retries: 60 # waits for Jellyfin to answer: 60 x 5 s = 5 minutes
# Profile pictures (make jellyfin-profile-check / jellyfin-profile-fix)
jellyfin_user_images_apply: false # true = re-attach pictures that are on disk but no longer linked to their user
jellyfin_user_images_search_root: /config # the pod folder searched for  */users/<name>/profile.*
jellyfin_user_images_types:
  png: image/png
  jpg: image/jpeg
  jpeg: image/jpeg
  gif: image/gif
  webp: image/webp
  bmp: image/bmp

# Major upgrades (make jellyfin-upgrade-check / jellyfin-upgrade / jellyfin-rollback; roles/jellyfin/tasks/upgrade*.yml)
jellyfin_upgrade_confirm: "" # -e jellyfin_upgrade_confirm=UPGRADE skips the question (for scripts)
jellyfin_upgrade_confirmed: false # set by the upgrade playbook only: lets `make jellyfin` change the major version
jellyfin_allow_downgrade: false # set by the rollback playbook only: lets `make jellyfin` deploy an older version
jellyfin_upgrade_min_from: "10.10.7" # Jellyfin 12 only upgrades from 10.10.7 or any 10.11.x
jellyfin_upgrade_startup_minutes: 45 # how long the new version may take to migrate the database before the upgrade gives up waiting
jellyfin_upgrade_space_factor: 3 # free space needed on the config volume, as a multiple of what Jellyfin uses there now
jellyfin_upgrade_snapshot: true # copy the config volume (database) on the node before upgrading: the fast way back
jellyfin_upgrade_pull_image: true # pull the new image onto the node first, so a wrong tag is found before anything is stopped
jellyfin_upgrade_crictl: /var/lib/rancher/rke2/bin/crictl
jellyfin_upgrade_containerd_socket: unix:///run/k3s/containerd/containerd.sock
jellyfin_upgrade_snapshot_dir: "" # rollback: the snapshot folder to use (empty = the newest one)
jellyfin_rollback_confirm: "" # -e jellyfin_rollback_confirm=ROLLBACK skips the question
jellyfin_cleanup_confirm: "" # -e jellyfin_cleanup_confirm=DELETE skips the question (make jellyfin-upgrade-cleanup)
