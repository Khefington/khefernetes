---
# Jellyfin cannot see files added over NFS by another machine (no filesystem events),
# so after an import we ask it to rescan its libraries. Skipped when the API key does not exist yet (run `make jellyfin-provision`).
- name: Find Jellyfin and its API key
  ansible.builtin.import_tasks: api_endpoint.yml

- name: Ask Jellyfin to scan all libraries (runs in the background)
  ansible.builtin.uri:
    url: "{{ jellyfin_api_url }}/Library/Refresh"
    method: POST
    headers:
      Authorization: 'MediaBrowser Token="{{ jellyfin_api_key }}"'
    status_code: [200, 204]
  no_log: true
  changed_when: true
  when: jellyfin_api_key | length > 0
