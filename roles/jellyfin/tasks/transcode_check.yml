---
# READ-ONLY. Jellyfin writes one log per transcode (FFmpeg.Transcode-*.log) that starts with the exact ffmpeg command line and
# contains ffmpeg's "Stream mapping". That is the definitive answer to "did this playback use the GPU?".
#   make jellyfin-transcode-check
- name: Read the newest transcode logs inside the pod
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      {{ kubectl_cmd }} -n {{ media_namespace }} exec -i deploy/jellyfin -- sh -s <<'SCRIPT'
      cd {{ jellyfin_log_dir }} 2>/dev/null || { echo "No log folder yet ({{ jellyfin_log_dir }})."; exit 0; }
      n=0
      for f in $(ls -t FFmpeg.Transcode-*.log 2>/dev/null | head -{{ jellyfin_transcode_check_count }}); do
        n=$((n + 1))
        hw=$(grep -m1 -o -E -- '-hwaccel [a-z0-9_]+' "$f" | cut -d' ' -f2)
        # ffmpeg's own summary of the video stream, e.g.  Stream #0:0 -> #0:0 (hevc (native) -> h264 (h264_qsv))
        map=$(grep -m1 -E 'Stream #0:[0-9]+ -> #0:[0-9]+ \([a-z0-9_]+ \(' "$f")
        dec=$(printf '%s' "$map" | sed -n -E 's/.*\(([a-z0-9_]+) \(([a-z0-9_]+)\) -> .*/\2/p')
        enc=$(printf '%s' "$map" | sed -n -E 's/.*-> ([a-z0-9_]+) \(([a-z0-9_]+)\)\).*/\2/p')
        echo "== $f  ($(stat -c %y "$f" | cut -d. -f1))"
        case "$dec" in
          *_qsv|*_vaapi) echo "   video decoding: HARDWARE (decoder $dec)" ;;
          *) if [ -n "$hw" ]; then echo "   video decoding: HARDWARE (-hwaccel $hw)"; else echo "   video decoding: software"; fi ;;
        esac
        case "$enc" in
          *_qsv|*_vaapi) echo "   video encoding: HARDWARE (encoder $enc)" ;;
          "") echo "   video encoding: unknown (no video mapping line in this log; read its first lines)" ;;
          *) echo "   video encoding: software (encoder $enc)" ;;
        esac
        grep -A3 -m1 'Stream mapping' "$f" | sed 's/^/   /'
      done
      [ "$n" -eq 0 ] && echo "No transcode logs yet: nothing has been transcoded since the logs were last cleaned. Play something that needs transcoding, then run this again."
      exit 0
      SCRIPT
  register: jellyfin_transcode_check
  changed_when: false
  check_mode: false

- name: Newest transcodes
  ansible.builtin.debug:
    var: jellyfin_transcode_check.stdout_lines
