---
- name: Make sure the API key Secret exists (created by `make jellyfin-provision`)
  ansible.builtin.command: "{{ kubectl_cmd }} -n {{ media_namespace }} get secret jellyfin-api -o name"
  register: jellyfin_backup_secret
  changed_when: false
  failed_when: false

- name: Stop with a helpful message if it is missing
  ansible.builtin.assert:
    that: jellyfin_backup_secret.rc == 0
    fail_msg: "The Secret 'jellyfin-api' does not exist yet. Run `make jellyfin-provision` first; it creates the API key and the Secret."

- name: Create the manifest folder
  ansible.builtin.file:
    path: "{{ k8s_app_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Write the manifest
  ansible.builtin.template:
    src: jellyfin-backup.yaml.j2
    dest: "{{ jellyfin_backup_manifest_path }}"
    mode: "0644"

- name: Kubectl apply
  ansible.builtin.command: "{{ kubectl_cmd }} apply -f {{ jellyfin_backup_manifest_path }}"
  register: jellyfin_backup_apply
  changed_when: jellyfin_backup_apply.stdout_lines | reject('search', 'unchanged') | list | length > 0

- name: Run one backup right now as a test
  ansible.builtin.include_tasks: run_now.yml
  when: jellyfin_backup_run_now | bool
