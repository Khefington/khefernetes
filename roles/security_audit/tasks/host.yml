---
# READ-ONLY. Runs files/host_audit.py on this machine (as root, to read sshd's settings and the account files).
- name: Audit this machine
  ansible.builtin.script:
    cmd: "host_audit.py --kind {{ security_audit_kind }}"
    executable: "{{ security_audit_python }}"
  become: true
  register: security_audit_host
  changed_when: false
  check_mode: false

- name: Findings for this machine
  ansible.builtin.debug:
    msg: "{{ security_audit_host.stdout_lines }}"
