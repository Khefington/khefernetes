---
- name: Remove the kernel settings file
  ansible.builtin.file:
    path: "{{ host_watchdog_sysctl_file }}"
    state: absent

- name: Back to the kernel's own defaults, now
  ansible.builtin.command: sysctl -w kernel.panic=0 kernel.panic_on_oops=0 kernel.softlockup_panic=0 kernel.hardlockup_panic=0
  changed_when: true
  failed_when: false

- name: Remove the journal setting
  ansible.builtin.file:
    path: "{{ host_watchdog_journald_file }}"
    state: absent
  register: host_watchdog_journald_gone

- name: Restart the journal service
  ansible.builtin.command: systemctl restart systemd-journald # noqa: command-instead-of-module
  when: host_watchdog_journald_gone is changed # noqa: no-handler
  changed_when: true

- name: Proxmox's watchdog service goes back to the software watchdog (softdog) at the next boot
  ansible.builtin.lineinfile:
    path: "{{ host_watchdog_ha_default_file }}"
    regexp: '^WATCHDOG_MODULE='
    state: absent
  register: host_watchdog_ha_gone
  failed_when: false

- name: Say what is left
  ansible.builtin.debug:
    msg: >-
      Removed. {{ 'The hardware watchdog stays active until the next reboot of castellan.' if host_watchdog_ha_gone is changed else '' }}
