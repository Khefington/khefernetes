---
# One role, two desired states. The default builds the VM; 'absent' removes it (playbooks/cluster/destroy_vms.yml).
- name: Build the VM
  ansible.builtin.include_tasks: present.yml
  when: proxmox_vms_state == 'present'

- name: Remove the VM
  ansible.builtin.include_tasks: absent.yml
  when: proxmox_vms_state == 'absent'
