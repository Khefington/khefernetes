---
# 1. Sanity checks before touching anything
- name: Refuse to run with swap enabled (kubelet will not start)
  ansible.builtin.command: swapon --show --noheadings
  register: swap_state
  changed_when: false
  check_mode: false
  failed_when: swap_state.stdout | length > 0

# 2. Install the binaries
- name: Check which RKE2 version is installed (empty output means none)
  ansible.builtin.command: /usr/local/bin/rke2 --version
  register: rke2_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download the RKE2 install script
  ansible.builtin.get_url:
    url: "{{ rke2_install_script_url }}"
    dest: /usr/local/share/rke2-install.sh
    mode: "0755"

- name: Install RKE2 {{ rke2_version }} ({{ rke2_type }})
  ansible.builtin.command: /usr/local/share/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ rke2_type }}"
  when: rke2_version not in rke2_installed.stdout
  notify: Restart rke2

# 3. Configuration
- name: Create the RKE2 config directory
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: "0755"

- name: Write config.yaml
  ansible.builtin.template:
    src: "config-{{ rke2_type }}.yaml.j2"
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600" # it contains the join token
  diff: false # keep the token out of --diff output
  notify: Restart rke2

# Run pending restarts NOW so the service starts with its config in place.
- name: Apply config/install changes before the final start
  ansible.builtin.meta: flush_handlers

# 4. Run it
- name: Enable and start rke2-{{ rke2_type }}
  ansible.builtin.systemd:
    name: "rke2-{{ rke2_type }}"
    enabled: true
    state: started

- name: Wait for the Kubernetes API to answer (servers only)
  ansible.builtin.wait_for:
    port: "{{ rke2_api_port }}"
    timeout: 600
  when: rke2_type == 'server'
