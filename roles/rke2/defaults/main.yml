---
# server or agent, decided by which inventory group the host is in
rke2_type: "{{ 'server' if inventory_hostname in groups['anvil_control_planes'] else 'agent' }}"

# Shared secret that lets nodes join
rke2_token: "{{ vault_rke2_token }}"

# Cluster Registration
rke2_server_host: "{{ hostvars[groups['anvil_control_planes'][0]].ansible_host }}"
rke2_supervisor_port: 9345
rke2_api_port: 6443

# Names/IPs the API server certificate
rke2_tls_sans:
  - "{{ ansible_host }}"
  - "{{ inventory_hostname }}"
  - "{{ inventory_hostname }}.{{ lan_domain }}"

rke2_install_script_url: https://get.rke2.io
rke2_config_dir: /etc/rancher/rke2

# User for RKE2 cluster
rke2_kubectl_user: "{{ ansible_user }}"
