---
# Proxmox VE 9 (Debian trixie) uses deb822 .sources files; VE 8 (bookworm) uses .list files.
- name: Gather release facts
  ansible.builtin.setup:
    gather_subset: [min]

- name: Remove enterprise repos (deb822 layout)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop: [pve-enterprise.sources, ceph.sources]
  when: ansible_distribution_release == 'trixie'

- name: Add no-subscription repo (deb822 layout)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
  when: ansible_distribution_release == 'trixie'

- name: Remove enterprise repos (legacy layout)
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop: [pve-enterprise.list, ceph.list]
  when: ansible_distribution_release == 'bookworm'

- name: Add no-subscription repo (legacy layout)
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
    filename: pve-no-subscription
    state: present
  when: ansible_distribution_release == 'bookworm'

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install helper packages
  ansible.builtin.apt:
    name: [python3-proxmoxer, python3-requests, sudo, vim, htop, lvm2]
    state: present

- name: Remove subscription nag (optional)
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res\\.data\\.status\\.toLowerCase\\(\\) !== 'active'"
    replace: "false"
  when: proxmox_remove_subscription_nag | bool
  notify: Restart pveproxy
