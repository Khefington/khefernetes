---
# VMs that get the GPU are the cluster hosts with  vm_gpu_passthrough: true  (inventories/host_vars/<host>.yml).
# The device itself is set in inventories/group_vars/proxmox/gpu.yml.
proxmox_vm_gpu_pci_address: "{{ gpu_passthrough_pci_address }}"
# Extra options for the hostpci line. pcie=1 needs the q35 machine type this role sets.
proxmox_vm_gpu_hostpci_options: "pcie=1"
# Machine type and firmware the passthrough needs (q35 has PCIe; OVMF is UEFI).
proxmox_vm_gpu_machine: q35
# Stopping a VM that is already running (a restart of a live service) must be asked for:
#   make vms ARGS="-e proxmox_vm_gpu_allow_restart=true"
proxmox_vm_gpu_allow_restart: false
proxmox_vm_gpu_shutdown_timeout_seconds: 180
# Test hook: where the PCI devices are listed.
proxmox_vm_gpu_sysfs_root: /sys
