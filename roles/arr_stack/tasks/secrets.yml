---
# Kubernetes Secrets, created from the vault. The values go to kubectl on stdin, so they never appear in a process list or a file.
- name: Secret for the three apps (API keys and the shared password)
  ansible.builtin.command:
    cmd: "{{ kubectl_cmd }} apply -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: arr-secrets
        namespace: {{ media_namespace }}
      type: Opaque
      data:
        sonarr-api-key: "{{ vault_sonarr_api_key | string | b64encode }}"
        radarr-api-key: "{{ vault_radarr_api_key | string | b64encode }}"
        prowlarr-api-key: "{{ vault_prowlarr_api_key | string | b64encode }}"
        password: "{{ vault_arr_password | string | b64encode }}"
  register: arr_secret_apps
  changed_when: "'unchanged' not in arr_secret_apps.stdout"
  no_log: true

- name: Secret for the VPN tunnel (the Nord WireGuard key)
  ansible.builtin.command:
    cmd: "{{ kubectl_cmd }} apply -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: vpn-secrets
        namespace: {{ arr_vpn_namespace }}
      type: Opaque
      data:
        wireguard-private-key: "{{ arr_vpn_wireguard_key | string | b64encode }}"
  register: arr_secret_vpn
  changed_when: "'unchanged' not in arr_secret_vpn.stdout"
  no_log: true
