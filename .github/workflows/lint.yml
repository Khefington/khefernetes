---
name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      # The real vault and password are not in the repo; give the linter placeholders.
      - run: |
          echo ci > .vault_pass
          printf -- '---\nvault_ansible_become_password: ci\nvault_proxmox_api_token_secret: ci\nvault_rke2_token: ci\nvault_jellyfin_api_key: cicicicicici\n' > inventories/group_vars/all/vault.yml
      - run: yamllint .
      - run: python3 scripts/check-jinja-syntax.py
      - run: ansible-lint
      - run: |
          for p in playbooks/site.yml playbooks/*/*.yml; do ansible-playbook --syntax-check "$p" > /dev/null; done
