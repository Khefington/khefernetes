---
# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: vault-must-be-encrypted
        name: ansible-vault files must be encrypted
        language: system
        entry: scripts/check-vault-encrypted.sh
        files: (^|/)vault[^/]*\.ya?ml$
        exclude: vault\.example\.yml$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
  - repo: https://github.com/ansible/ansible-lint
    rev: v24.9.2
    hooks:
      - id: ansible-lint
        additional_dependencies: [ansible-core]
